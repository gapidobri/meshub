{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="10; url={{.Refresh}}">{{end}}
<title>{{.Title}}</title>
<style>
	:root {
		--bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --card: #ffffff;
		--ok: #15803d; --warn: #b45309; --off: #a8a29e;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --card: #292524;
			--ok: #4ade80; --warn: #fbbf24; --off: #78716c;
		}
	}
	* { box-sizing: border-box; }
	body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
		font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
	main { max-width: 1100px; margin: 0 auto; }
	header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
	h1 { font-size: 20px; margin: 0; }
	h2 { font-size: 15px; margin: 28px 0 8px; }
	.muted { color: var(--muted); }
	.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
	table { width: 100%; border-collapse: collapse; }
	th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
	th { font-weight: 600; color: var(--muted); font-size: 12px; }
	tr:last-child td { border-bottom: 0; }
	td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
	.state { display: inline-flex; align-items: center; gap: 6px; }
	.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
	.online .dot { background: var(--ok); }
	.stale .dot { background: var(--warn); }
	.empty { padding: 16px 12px; color: var(--muted); }
	a { color: inherit; }
	.hub { padding: 16px; display: grid; gap: 10px; }
	.hub .row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
	.hub .label { color: var(--muted); min-width: 96px; }
	.key { user-select: all; word-break: break-all; }
	button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
		background: var(--fg); color: var(--bg); cursor: pointer; }
	.msg { margin: 16px 0 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
	ul.results { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
	.pending .dot { background: var(--warn); }
	.paired .dot { background: var(--ok); }
	.inline { display: inline; margin: 0; }
	button.secondary { background: transparent; color: var(--fg); }
	td form + form { margin-left: 4px; }
	textarea { width: 100%; min-height: 280px; padding: 12px; border: 1px solid var(--line); border-radius: 6px;
		background: var(--bg); color: var(--fg); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
	.stack { padding: 16px; display: grid; gap: 12px; }
	.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
	td.wrap { white-space: normal; word-break: break-word; }
	input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
		background: var(--bg); color: var(--fg); min-width: 0; }
	input.grow { flex: 1 1 240px; }
	pre.result { margin: 0; max-height: 320px; overflow: auto; white-space: pre-wrap;
		font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
	.ok .dot { background: var(--ok); }
	.failed .dot, .unknown .dot { background: var(--warn); }
</style>
</head>
<body>
<main>
	<header>
		<h1><a href="/" style="text-decoration:none">meshub</a></h1>
		{{with .Header}}<span class="muted">{{.}}</span>{{end}}
	</header>
	{{with .Message}}<p class="msg">{{.}}</p>{{end}}
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}
