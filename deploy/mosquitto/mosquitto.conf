# Production broker for meshub: every client logs in, and may only use its
# own topics (see acl). Users are in passwd, made with mosquitto_passwd; see
# deploy/README.md. Send the broker SIGHUP after changing either file.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT, for the backend and the gateways, whose firmware has no TLS.
# Keep it on the private network the gateways are on; do not expose it to
# the internet.
listener 1883
protocol mqtt

# MQTT over TLS, for applications connecting from elsewhere. Put a
# certificate for the broker's host name in ./certs and uncomment.
#listener 8883
#protocol mqtt
#certfile /mosquitto/certs/fullchain.pem
#keyfile /mosquitto/certs/privkey.pem

# Keep retained gateway and device statuses across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
